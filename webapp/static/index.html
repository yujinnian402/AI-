<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DeepSeek Web Chat Demo</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="panel">
      <h2>Settings</h2>

      <label>Model</label>
      <div class="row">
        <select id="model"></select>
        <button id="refreshModels">刷新</button>
      </div>

      <label>System Prompt</label>
      <textarea id="system" rows="5" placeholder="背景提示词，可随时改。留空=无 system。"></textarea>

      <div class="grid">
        <div>
          <label>Temperature</label>
          <input id="temperature" type="number" step="0.05" min="0" max="2" value="0.7" />
        </div>
        <div>
          <label>Top_p</label>
          <input id="top_p" type="number" step="0.05" min="0" max="1" value="0.9" />
        </div>
        <div>
          <label>Max tokens</label>
          <input id="max_tokens" type="number" min="1" max="8000" value="1200" />
        </div>
        <div>
          <label>Keep turns</label>
          <input id="keep_turns" type="number" min="1" max="200" value="20" />
        </div>
      </div>

      <div class="row">
        <label class="chk"><input id="show_usage" type="checkbox" checked /> 显示 usage</label>
        <label class="chk"><input id="show_reasoning" type="checkbox" /> 显示 reasoning_content</label>
      </div>

      <div class="row">
        <button id="reset">重置对话</button>
      </div>

      <div class="status" id="status">ready</div>
      <div class="usage" id="usage"></div>
      <div class="usage" id="total"></div>
    </aside>

    <main class="chat">
      <div class="messages" id="messages"></div>

      <div class="composer">
        <textarea id="input" rows="3" placeholder="输入问题…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="send">Send</button>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
