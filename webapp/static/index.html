<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DeepSeek Web Chat Demo</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>


<div class="auth-overlay" id="authOverlay" style="display:none;">
  <div class="auth-card">
    <div class="auth-oauth">
      <a href="/api/auth/github" class="oauth-btn" title="GitHub 登录">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
      <a href="/api/auth/google" class="oauth-btn" title="Google 登录">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
      </a>
    </div>

    <div class="auth-divider">或邮箱登录</div>
    <div class="auth-tabs">
      <button class="tab active" id="tabLogin">登录</button>
      <button class="tab" id="tabRegister">注册</button>
    </div>

    <div class="auth-row">
      <label>Email</label>
      <input id="authEmail" autocomplete="email" />
    </div>

    <div class="auth-row">
      <label>Password</label>
      <input id="authPass" type="password" autocomplete="current-password" />
    </div>

    <div class="auth-actions">
      <button id="authSubmit">继续</button>
      <button id="rootFaceRealtimeLogin">Root 实时人脸登录</button>
      <div class="auth-err" id="authErr"></div>
    </div>

    <div class="auth-hint">
      先做邮箱注册/登录；下一轮我们接 GitHub/Google/Apple 一键登录 😊
    </div>
  </div>
</div>

<div class="app">
    <aside class="panel">
      <h2>Settings</h2>

      <label>Model</label>
      <div class="row">
        <select id="model"></select>
        <button id="refreshModels">刷新</button>
      </div>

      <label>System Prompt</label>
      <textarea id="system" rows="5" placeholder="背景提示词，可随时改。留空=无 system。"></textarea>

      <div class="grid">
        <div>
          <label>Temperature</label>
          <input id="temperature" type="number" step="0.05" min="0" max="2" value="0.7" />
        </div>
        <div>
          <label>Top_p</label>
          <input id="top_p" type="number" step="0.05" min="0" max="1" value="0.9" />
        </div>
        <div>
          <label>Max tokens</label>
          <input id="max_tokens" type="number" min="1" max="8000" value="1200" />
        </div>
        <div>
          <label>Keep turns</label>
          <input id="keep_turns" type="number" min="1" max="200" value="20" />
        </div>
      </div>

      <div class="row">
        <label class="chk"><input id="show_usage" type="checkbox" checked /> 显示 usage</label>
        <label class="chk"><input id="show_reasoning" type="checkbox" /> 显示 reasoning_content</label>
      </div>

      <div class="row">
        <button id="reset">重置对话</button>
        <button id="logout">退出登录</button>
        <button id="rootFaceEnroll">录入人脸</button>
      </div>

      <div class="status" id="status">ready</div>
      <div class="usage" id="usage"></div>
      <div class="usage" id="total"></div>
    </aside>

    <main class="chat">
      <div class="messages" id="messages"></div>

      <div class="composer">
        <textarea id="input" rows="3" placeholder="输入问题...(Enter 发送 / Shift+Enter 换行)"></textarea>
        <button id="send">Send</button>
      </div>
    </main>
  </div>

  <div id="camModal" class="cam-modal" style="display:none;">
  <div class="cam-card">
    <div class="cam-title" id="camTitle">摄像头</div>
    <div class="cam-video-wrap">
      <video id="camVideo" autoplay playsinline muted></video>
      <canvas id="camOverlay"></canvas>
    </div>
    <canvas id="camCanvas" style="display:none;"></canvas>
    <div class="cam-actions">
      <button id="camCaptureEnroll">拍照录入</button>
      <button id="camStop">关闭摄像头</button>
    </div>
    <div id="camHint" class="cam-hint"></div>
  </div>
</div>

  <script src="static/app.js?v=5"></script>
</body>
</html>
